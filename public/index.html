<html lang="en">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shithouse Football — Live Scores, All Leagues, All Matches">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#080808; --pitch:#0f1a0f; --lime:#b5ff2d; --lime-dim:#b5ff2d18;
  --white:#f0f0f0; --grey:#888; --dimgrey:#7a7a7a; --red:#ff2d2d;
  --red-dim:#ff2d2d20; --yellow:#ffd600; --blue:#2d8fff; --border:#1e1e1e;
  --surface:#111; --sidebar:240px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--white);font-family:'Oswald',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

/* ── LAYOUT ── */
.app-shell{display:flex;flex:1;min-height:0;}
.sidebar{width:var(--sidebar);flex-shrink:0;background:#0a0a0a;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main-area{flex:1;min-width:0;display:flex;flex-direction:column;}

/* ── HEADER ── */
header{background:var(--lime);border-bottom:4px solid var(--black);flex-shrink:0;}
.header-inner{display:flex;align-items:stretch;justify-content:space-between;}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,4vw,42px);color:var(--black);letter-spacing:0.02em;padding:10px 20px;line-height:1;display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
.site-title span{display:block;font-size:0.38em;letter-spacing:0.18em;font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;color:#1a1a1a;margin-top:2px;}
.header-meta{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:10px 16px;gap:4px;}
.live-badge{display:flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-family:'DM Mono',monospace;font-size:11px;padding:3px 8px;border-radius:2px;letter-spacing:0.1em;}
.live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.last-updated{font-family:'DM Mono',monospace;font-size:10px;color:#2a2a2a;}

/* ── SIDEBAR ── */
.sidebar-section{padding:14px 12px 6px;}
.sidebar-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dimgrey);margin-bottom:8px;padding:0 4px;}
.sidebar-btn{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:none;border-radius:4px;padding:8px 10px;cursor:pointer;transition:background 0.15s;text-align:left;margin-bottom:2px;}
.sidebar-btn:hover{background:#161616;}
.sidebar-btn.active{background:var(--lime-dim);border-left:2px solid var(--lime);}
.sidebar-btn-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0;border-radius:2px;}
.sidebar-btn-logo.flag{font-size:18px;width:22px;text-align:center;line-height:22px;}
.sidebar-btn-text{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;color:var(--white);letter-spacing:0.02em;line-height:1.2;}
.sidebar-btn-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--dimgrey);display:block;margin-top:1px;}
.sidebar-btn.active .sidebar-btn-text{color:var(--lime);}
.sidebar-divider{height:1px;background:var(--border);margin:10px 12px;}

/* ── CONTROLS ── */
.controls{background:var(--pitch);border-bottom:2px solid var(--lime);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-wrap:wrap;min-height:46px;flex-shrink:0;}
.date-nav{display:flex;align-items:center;height:46px;}
.date-arrow{background:transparent;border:none;color:var(--lime);font-size:22px;width:36px;height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s;}
.date-arrow:hover{background:var(--lime-dim);}
.date-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.08em;color:var(--white);min-width:120px;text-align:center;}
.filter-tabs{display:flex;height:46px;align-items:center;}
.filter-tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--grey);font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;padding:0 14px;height:46px;cursor:pointer;transition:all 0.15s;}
.filter-tab:hover{color:var(--white);}
.filter-tab.active{color:var(--lime);border-bottom-color:var(--lime);}
.refresh-btn{background:transparent;border:1px solid var(--dimgrey);color:var(--grey);font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;padding:6px 14px;cursor:pointer;border-radius:2px;transition:all 0.15s;text-transform:uppercase;}
.refresh-btn:hover{border-color:var(--lime);color:var(--lime);}

/* ── SEARCH ── */
.search-bar{background:#0c0c0c;border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.search-wrap{position:relative;flex:1;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--grey);font-size:13px;pointer-events:none;}
.search-input{width:100%;background:#161616;border:1px solid var(--dimgrey);border-radius:3px;padding:8px 12px 8px 30px;font-family:'Oswald',sans-serif;font-size:14px;color:var(--white);outline:none;transition:border-color 0.15s;}
.search-input:focus{border-color:var(--lime);}
.search-input::placeholder{color:var(--dimgrey);}
.search-clear{background:transparent;border:none;color:var(--grey);font-size:16px;cursor:pointer;padding:4px 6px;display:none;}
.search-clear.show{display:block;}
.search-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--grey);min-width:56px;text-align:right;white-space:nowrap;}

/* ── SCROLL AREA ── */
.scroll-area{flex:1;overflow-y:auto;}
.page{display:none;padding:16px 12px 60px;max-width:860px;margin:0 auto;width:100%;}
.page.active{display:block;}

/* ── COUNTRY DIVIDERS ── */
.country-divider{display:flex;align-items:center;gap:10px;margin:20px 0 8px;}
.country-divider-flag{font-size:14px;}
.country-divider-label{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:0.18em;color:var(--grey);text-transform:uppercase;white-space:nowrap;}
.country-divider-line{flex:1;height:1px;background:var(--border);}

/* ── LEAGUE BLOCK ── */
.league-block{margin-bottom:12px;border:1px solid var(--border);border-radius:3px;overflow:hidden;animation:slideUp 0.25s ease forwards;opacity:0;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.league-block:nth-child(1){animation-delay:.03s}.league-block:nth-child(2){animation-delay:.06s}
.league-block:nth-child(3){animation-delay:.09s}.league-block:nth-child(4){animation-delay:.12s}
.league-block:nth-child(5){animation-delay:.15s}.league-block:nth-child(6){animation-delay:.18s}
.league-block:nth-child(7){animation-delay:.21s}.league-block:nth-child(8){animation-delay:.24s}
.league-header{background:#111;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:background 0.15s;}
.league-header:hover{background:#161616;}
.league-flag{font-size:15px;flex-shrink:0;}
.league-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey);}
.priority-dot{width:5px;height:5px;background:var(--lime);border-radius:50%;flex-shrink:0;}
.league-country{font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);}
.league-match-count{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);}
.standings-toggle{font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);margin-left:8px;}
.league-header:hover .standings-toggle,.league-header.standings-open .standings-toggle{color:var(--lime);}

/* ── STANDINGS PANEL ── */
.standings-panel{display:none;border-bottom:1px solid var(--border);background:#0d0d0d;}
.standings-panel.open{display:block;}
.standings-loading,.detail-loading{text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);}
.standings-table{width:100%;border-collapse:collapse;}
.standings-table th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--dimgrey);text-transform:uppercase;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
.standings-table th.left{text-align:left;}
.standings-table td{font-family:'Oswald',sans-serif;font-size:13px;padding:6px 8px;text-align:center;border-bottom:1px solid #0f0f0f;color:var(--white);}
.standings-table td.left{text-align:left;}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table tr:hover td{background:#111;}
.pos-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);}
.team-cell{display:flex;align-items:center;gap:7px;}
.team-cell img{width:16px;height:16px;object-fit:contain;}
.pts{font-weight:700;color:var(--lime);}
.zone-promo td{border-left:2px solid var(--blue);}
.zone-euro td{border-left:2px solid var(--yellow);}
.zone-relegation td{border-left:2px solid var(--red);}
.form-pip{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 1px;}
.form-w{background:#22aa44;}.form-d{background:var(--dimgrey);}.form-l{background:var(--red);}

/* ── MATCH ROW ── */
.match-row{display:grid;grid-template-columns:64px 1fr auto 1fr;align-items:center;padding:11px 12px;border-bottom:1px solid #111;gap:10px;cursor:pointer;transition:background 0.12s;}
.match-row:last-child{border-bottom:none;}
.match-row:hover{background:#0e0e0e;}
.match-row.search-match{background:#0b160b;}
.match-row.open{background:#0d0d0d;}
.status-cell{text-align:center;}
.status-pill{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;padding:2px 6px;border-radius:2px;letter-spacing:0.04em;}
.s-live{background:var(--red-dim);color:var(--red);animation:livePulse 2s ease-in-out infinite;}
@keyframes livePulse{0%,100%{background:var(--red-dim)}50%{background:#ff2d2d30}}
.s-ht{background:#ffd60020;color:var(--yellow);}
.s-ft{background:#2d8fff18;color:var(--blue);}
.s-ns{background:transparent;color:var(--dimgrey);font-size:12px;}
.s-other{background:transparent;color:var(--dimgrey);}
.team-home{display:flex;align-items:center;justify-content:flex-end;gap:9px;}
.team-away{display:flex;align-items:center;justify-content:flex-start;gap:9px;}
.team-logo{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
.team-name{font-family:'Oswald',sans-serif;font-weight:500;font-size:15px;color:var(--white);line-height:1.2;}
.team-name.home{text-align:right;}.team-name.away{text-align:left;}
.team-name.winner{color:var(--lime);font-weight:700;}.team-name.hit{color:var(--lime);font-weight:700;}
.score-block{display:flex;align-items:center;justify-content:center;min-width:56px;}
.score-num{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--white);width:26px;text-align:center;line-height:1;}
.score-num.live{color:var(--lime);}.score-num.winner{color:var(--lime);}
.score-dash{font-family:'DM Mono',monospace;font-size:14px;color:var(--dimgrey);width:12px;text-align:center;}
.score-vs{font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;color:var(--dimgrey);}

/* ── MATCH DETAIL ── */
.match-detail{display:none;border-bottom:1px solid var(--border);background:#0a0a0a;}
.match-detail.open{display:block;}
.detail-tabs{display:flex;border-bottom:1px solid var(--border);}
.detail-tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--grey);font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;padding:10px;cursor:pointer;transition:all 0.15s;}
.detail-tab:hover{color:var(--white);}
.detail-tab.active{color:var(--lime);border-bottom-color:var(--lime);}
.detail-pane{display:none;padding:12px;}
.detail-pane.active{display:block;}

/* ── EVENTS ── */
.events-list{display:flex;flex-direction:column;gap:4px;}
.event-row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:6px;padding:5px 2px;border-radius:3px;}
.event-row:hover{background:#111;}
.event-home{text-align:right;font-family:'Oswald',sans-serif;font-size:13px;color:var(--white);}
.event-away{text-align:left;font-family:'Oswald',sans-serif;font-size:13px;color:var(--white);}
.event-min{text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);}
.event-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);display:block;margin-top:1px;}
.sub-on{color:var(--lime);font-weight:600;}
.sub-off{color:var(--red);opacity:0.85;}

/* ── STATS ── */
.stats-list{display:flex;flex-direction:column;gap:10px;}
.stat-labels{display:flex;justify-content:space-between;margin-bottom:4px;}
.stat-val{font-family:'DM Mono',monospace;font-size:12px;color:var(--white);}
.stat-name{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--dimgrey);}
.stat-bar-wrap{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--border);}
.stat-bar-home{background:var(--lime);height:100%;transition:width 0.5s ease;}
.stat-bar-away{background:var(--blue);height:100%;transition:width 0.5s ease;}

/* ── LINEUP / PITCH ── */
.lineup-wrap{display:flex;gap:0;flex-direction:column;}
.lineup-header{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
.lineup-team{text-align:center;}
.lineup-team-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.06em;color:var(--white);}
.lineup-formation{font-family:'DM Mono',monospace;font-size:11px;color:var(--lime);margin-top:2px;}
.pitch-container{position:relative;background:#1a3a1a;margin:0;overflow:hidden;}
.pitch-container::before{content:'';position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent,transparent 49px,rgba(255,255,255,0.03) 49px,rgba(255,255,255,0.03) 50px);
  pointer-events:none;}
.pitch-svg{width:100%;display:block;}
.pitch-line{stroke:rgba(255,255,255,0.25);stroke-width:1;fill:none;}
.pitch-line-bold{stroke:rgba(255,255,255,0.35);stroke-width:1.5;fill:none;}
.player-dot{cursor:default;}
.player-dot circle{transition:r 0.2s;}
.player-dot:hover circle{r:14;}
.player-name-text{font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;fill:var(--white);text-anchor:middle;pointer-events:none;}
.player-num-text{font-family:'DM Mono',monospace;font-size:8px;fill:rgba(255,255,255,0.7);text-anchor:middle;pointer-events:none;}
.lineup-subs{padding:10px 12px;border-top:1px solid var(--border);}
.subs-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--dimgrey);margin-bottom:8px;}
.subs-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;}
.sub-player{font-family:'Oswald',sans-serif;font-size:12px;color:var(--grey);display:flex;align-items:center;gap:6px;}
.sub-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);width:18px;}

/* ── STATE BOXES ── */
.state-box{text-align:center;padding:60px 20px;color:var(--grey);}
.spinner{width:36px;height:36px;border:3px solid #1e1e1e;border-top-color:var(--lime);border-radius:50%;animation:spin 0.65s linear infinite;margin:0 auto 18px;}
.mini-spinner{width:14px;height:14px;border:2px solid #1e1e1e;border-top-color:var(--lime);border-radius:50%;animation:spin 0.65s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:0.1em;color:var(--grey);margin-bottom:6px;}
.state-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);}
.error-box{background:#120808;border:1px solid #ff2d2d40;border-left:3px solid var(--red);border-radius:3px;padding:14px 16px;margin-bottom:14px;font-family:'DM Mono',monospace;font-size:12px;color:#ff8888;line-height:1.7;}
.no-data{text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);}

/* ── TEAM / LEAGUE PAGE ── */
.page-hero{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.page-hero-logo{width:56px;height:56px;object-fit:contain;}
.page-hero-flag{font-size:48px;line-height:1;}
.page-hero-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;color:var(--white);}
.page-hero-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--dimgrey);margin-top:4px;}
.page-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
.page-tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--grey);font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer;transition:all 0.15s;margin-bottom:-2px;}
.page-tab:hover{color:var(--white);}
.page-tab.active{color:var(--lime);border-bottom-color:var(--lime);}
.page-pane{display:none;}
.page-pane.active{display:block;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:0.12em;color:var(--grey);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── PLAYER STATS TABLE ── */
.player-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;}
.player-table th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--dimgrey);text-transform:uppercase;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
.player-table th.left{text-align:left;}
.player-table td{padding:7px 8px;text-align:center;border-bottom:1px solid #111;color:var(--white);font-family:'Oswald',sans-serif;}
.player-table td.left{text-align:left;}
.player-table tr:hover td{background:#0e0e0e;}
.player-table tr:last-child td{border-bottom:none;}
.player-rank{font-family:'DM Mono',monospace;font-size:10px;color:var(--dimgrey);}
.player-photo{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;}
.highlight{color:var(--lime);font-weight:700;}

/* ── TEAM STAT CARDS ── */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;text-align:center;}
.stat-card-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--lime);letter-spacing:0.04em;}
.stat-card-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--dimgrey);margin-top:4px;}

/* ── WC GROUP STANDINGS ── */
.wc-group-panel{border-top:1px solid var(--border);background:#0a0a0a;padding:10px 12px;}
.wc-group-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px;}
.wc-group-panel .standings-table tr.wc-qualify td{border-left:2px solid var(--yellow);}

footer{text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:10px;color:#222;border-top:1px solid var(--border);letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;}

@media(max-width:700px){
  .sidebar{display:none;}
  .team-name{font-size:13px;}.score-num{font-size:20px;}
  .match-row{grid-template-columns:56px 1fr auto 1fr;gap:6px;padding:10px 8px;}
  .filter-tab{padding:0 10px;font-size:12px;}
}

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS

var API_KEY="175fb95e18a6b2f2aabfe643dfaee5ea";
var API_BASE="https://v3.football.api-sports.io";
var API_HEADERS={"x-apisports-key":API_KEY};

var LIVE=["1H","2H","ET","BT","P","INT","LIVE"];
var FLAGS={
  England:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",

  Spain:"\uD83C\uDDEA\uD83C\uDDF8",Germany:"\uD83C\uDDE9\uD83C\uDDEA",Italy:"\uD83C\uDDEE\uD83C\uDDF9",
  France:"\uD83C\uDDEB\uD83C\uDDF7",Netherlands:"\uD83C\uDDF3\uD83C\uDDF1",Portugal:"\uD83C\uDDF5\uD83C\uDDF9",
  Turkey:"\uD83C\uDDF9\uD83C\uDDF7",USA:"\uD83C\uDDFA\uD83C\uDDF8",
  "Saudi-Arabia":"\uD83C\uDDF8\uD83C\uDDE6",Europe:"\uD83C\uDDEA\uD83C\uDDFA",
  World:"\uD83C\uDF0D",Brazil:"\uD83C\uDDE7\uD83C\uDDF7",Argentina:"\uD83C\uDDE6\uD83C\uDDF7",
  Mexico:"\uD83C\uDDF2\uD83C\uDDFD",Belgium:"\uD83C\uDDE7\uD83C\uDDEA",Japan:"\uD83C\uDDEF\uD83C\uDDF5",
  "South Korea":"\uD83C\uDDF0\uD83C\uDDF7",Australia:"\uD83C\uDDE6\uD83C\uDDFA",
  Colombia:"\uD83C\uDDE8\uD83C\uDDF4",Chile:"\uD83C\uDDE8\uD83C\uDDF1",
  Uruguay:"\uD83C\uDDFA\uD83C\uDDFE",Greece:"\uD83C\uDDEC\uD83C\uDDF7",
  China:"\uD83C\uDDE8\uD83C\uDDF3",Nigeria:"\uD83C\uDDF3\uD83C\uDDEC",Morocco:"\uD83C\uDDF2\uD83C\uDDE6"
};
var PRIORITY=[
  {league:"Premier League",country:"England",group:"England",flagKey:"England"},
  {league:"Championship",country:"England",group:"England",flagKey:"England"},
  {league:"League One",country:"England",group:"England",flagKey:"England"},
  {league:"League Two",country:"England",group:"England",flagKey:"England"},
  {league:"Scottish Premiership",country:"Scotland",group:"Scotland",flagKey:"Scotland"},
  {league:"La Liga",country:"Spain",group:"Spain",flagKey:"Spain"},
  {league:"La Liga2",country:"Spain",group:"Spain",flagKey:"Spain"},
  {league:"Serie A",country:"Italy",group:"Italy",flagKey:"Italy"},
  {league:"Serie B",country:"Italy",group:"Italy",flagKey:"Italy"},
  {league:"Bundesliga 1",country:"Germany",group:"Germany",flagKey:"Germany"},
  {league:"Bundesliga 2",country:"Germany",group:"Germany",flagKey:"Germany"},
  {league:"Ligue 1",country:"France",group:"France",flagKey:"France"},
  {league:"UEFA Champions League",country:"World",group:"UEFA",flagKey:"Europe"},
  {league:"UEFA Europa League",country:"World",group:"UEFA",flagKey:"Europe"},
  {league:"UEFA Europa Conference League",country:"World",group:"UEFA",flagKey:"Europe"},
  {league:"Eredivisie",country:"Netherlands",group:"Netherlands",flagKey:"Netherlands"},
  {league:"Super Lig",country:"Turkey",group:"Turkey",flagKey:"Turkey"},
  {league:"Primeira Liga",country:"Portugal",group:"Portugal",flagKey:"Portugal"},
  {league:"Major League Soccer",country:"USA",group:"United States",flagKey:"USA"},
  {league:"Pro League",country:"Saudi-Arabia",group:"Saudi Arabia",flagKey:"Saudi-Arabia"},
  {league:"Friendlies",country:"World",group:"International",flagKey:"World"},
  {league:"World Cup",country:"World",group:"International",flagKey:"World"}
];

function getPriority(name,country){
  var n=name.toLowerCase().trim(),c=country.toLowerCase().trim();
  for(var i=0;i<PRIORITY.length;i++){if(PRIORITY[i].league.toLowerCase().trim()===n&&PRIORITY[i].country.toLowerCase().trim()===c)return i;}
  return PRIORITY.length;
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
var currentDate=new Date(),currentFilter='all',refreshTimer=null,allFixtures=[],searchQuery='';
var matchCache={},standingsCache={};
var currentPage='scores';
var wcStandingsCache=null;

// ═══════════════════════════════════════════════════════════
// DIRECT API FETCH (browser -> API-Football directly)
// ═══════════════════════════════════════════════════════════
async function apiFetch(path){
  var res=await fetch(API_BASE+path,{headers:API_HEADERS});
  var data=await res.json();
  return data;
}

// ═══════════════════════════════════════════════════════════
// WC STANDINGS
// ═══════════════════════════════════════════════════════════
async function fetchWCStandings(){
  if(wcStandingsCache)return wcStandingsCache;
  try{
    var data=await apiFetch('/standings?league=1&season=2026');
    var groups={};
    ((data.response||[])[0]?.league?.standings||[]).forEach(function(group){
      if(group[0])groups[group[0].group]=group;
    });
    wcStandingsCache=groups;
    return groups;
  }catch(e){
    console.error('WC standings fetch failed:',e);
    return null;
  }
}

function renderWCGroupTable(teams,groupName){
  var rows=teams.map(function(t,i){
    var gd=(t.goalsDiff>0?'+':'')+t.goalsDiff;
    var logo=t.team.logo?'<img src="'+t.team.logo+'" width="14" height="14" style="object-fit:contain;vertical-align:middle;margin-right:5px" onerror="this.style.display=\'none\'">':'';
    return '<tr class="'+(i<2?'wc-qualify':'')+'">'
      +'<td class="pos-num left">'+(i+1)+'</td>'
      +'<td class="left"><div class="team-cell">'+logo+t.team.name+'</div></td>'
      +'<td>'+t.all.played+'</td>'
      +'<td>'+t.all.win+'</td>'
      +'<td>'+t.all.draw+'</td>'
      +'<td>'+t.all.lose+'</td>'
      +'<td>'+t.all.goals.for+'</td>'
      +'<td>'+t.all.goals.against+'</td>'
      +'<td>'+gd+'</td>'
      +'<td class="pts">'+t.points+'</td>'

  }).join('');

    +'</tr></thead><tbody>'+rows+'</tbody></table>'
    +'</div>';

// ═══════════════════════════════════════════════════════════
// PAGE NAVIGATION
// ═══════════════════════════════════════════════════════════
function showPage(name){
  currentPage=name;
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('scores-controls').style.display=name==='scores'?'block':'none';
  document.querySelectorAll('.sidebar-btn').forEach(function(b){b.classList.remove('active');});
  if(name==='scores') document.getElementById('lastUpdated').textContent='';
}

// ═══════════════════════════════════════════════════════════
// DATE / FILTER / SEARCH
// ═══════════════════════════════════════════════════════════
function fmtParam(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+"-"+m+"-"+day;}
function fmtLabel(d){
  var t=new Date();t.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);
  var diff=Math.round((x-t)/86400000);
  if(diff===0)return"TODAY";if(diff===-1)return"YESTERDAY";if(diff===1)return"TOMORROW";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase();
}
function changeDate(delta){currentDate.setDate(currentDate.getDate()+delta);document.getElementById("dateLabel").textContent=fmtLabel(currentDate);loadFixtures();}
function setFilter(f,el){currentFilter=f;document.querySelectorAll(".filter-tab").forEach(function(t){t.classList.remove("active");});el.classList.add("active");renderScores();}
function onSearch(){searchQuery=document.getElementById("searchInput").value.trim().toLowerCase();var b=document.getElementById("searchClear");if(searchQuery)b.classList.add("show");else b.classList.remove("show");renderScores();}
function clearSearch(){document.getElementById("searchInput").value="";searchQuery="";document.getElementById("searchClear").classList.remove("show");document.getElementById("searchCount").textContent="";renderScores();}

// ═══════════════════════════════════════════════════════════
// SCORES LOAD - now fetches directly from API-Football
// ═══════════════════════════════════════════════════════════
async function loadFixtures(){
  showState(true);hideError();showPage('scores');
  try{
    var dateStr=fmtParam(currentDate);
    var offset=new Date().getTimezoneOffset()*-1;
    console.log("Fetching with offset:",offset);

    // Fetch today directly from API-Football
    var data=await apiFetch('/fixtures?date='+dateStr);
    if(data.errors&&Object.keys(data.errors).length>0)throw new Error(JSON.stringify(data.errors));
    var combined=data.response||[];

    // Try next day for timezone edge cases
    try{
      var nextDate=new Date(currentDate);
      nextDate.setDate(nextDate.getDate()+1);
      var data2=await apiFetch('/fixtures?date='+fmtParam(nextDate));
      combined=combined.concat(data2.response||[]);
    }catch(e){console.log("Next-day fetch failed:",e.message);}

    // Filter to local date
    var seen=new Set();
    allFixtures=combined.filter(function(f){
      if(seen.has(f.fixture.id))return false;
      seen.add(f.fixture.id);
      var local=new Date(new Date(f.fixture.date).getTime()+offset*60*1000);
      var localDate=local.getUTCFullYear()+"-"+String(local.getUTCMonth()+1).padStart(2,'0')+"-"+String(local.getUTCDate()).padStart(2,'0');
      return localDate===dateStr;
    });

    matchCache={};standingsCache={};
    renderScores();
    document.getElementById("lastUpdated").textContent="Updated "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
    scheduleRefresh();
  }catch(e){showError(e.message);}
  finally{showState(false);}
}

// ═══════════════════════════════════════════════════════════
// RENDER SCORES
// ═══════════════════════════════════════════════════════════
function renderScores(){
  var container=document.getElementById("container");
  container.innerHTML="";
  var filtered=allFixtures;
  if(currentFilter==="live")filtered=allFixtures.filter(function(f){return LIVE.indexOf(f.fixture.status.short)!==-1;});
  else if(currentFilter==="ft")filtered=allFixtures.filter(function(f){return["FT","AET","PEN"].indexOf(f.fixture.status.short)!==-1;});
  else if(currentFilter==="ns")filtered=allFixtures.filter(function(f){return f.fixture.status.short==="NS";});

  var leagueMap={};
  filtered.forEach(function(f){var id=f.league.id;if(!leagueMap[id])leagueMap[id]={meta:f.league,matches:[]};leagueMap[id].matches.push(f);});
  var groups=Object.values(leagueMap).sort(function(a,b){var ap=getPriority(a.meta.name,a.meta.country),bp=getPriority(b.meta.name,b.meta.country);if(ap!==bp)return ap-bp;return a.meta.name.localeCompare(b.meta.name);});

  if(groups.length===0){container.innerHTML='<div class="state-box"><div class="state-title">No Matches</div><div class="state-sub">Nothing here</div></div>';document.getElementById("liveBadge").style.display="none";document.getElementById("searchCount").textContent="";return;}

  var searchActive=searchQuery.length>=2,totalHits=0,hasLive=false,lastGroup="";

  groups.forEach(function(group){
    var meta=group.meta,matches=group.matches;
    var pri=getPriority(meta.name,meta.country),isPriority=pri<PRIORITY.length;
    var visible=matches;
    if(searchActive){
      visible=matches.filter(function(f){return f.teams.home.name.toLowerCase().indexOf(searchQuery)!==-1||f.teams.away.name.toLowerCase().indexOf(searchQuery)!==-1;});
      if(visible.length===0)return;
      totalHits+=visible.length;
    }
    if(visible.some(function(m){return LIVE.indexOf(m.fixture.status.short)!==-1;}))hasLive=true;

    if(!searchActive){
      var groupLabel=isPriority?PRIORITY[pri].group:"__other__";
      var flagKey=isPriority?PRIORITY[pri].flagKey:null;
      if(groupLabel!==lastGroup){
        lastGroup=groupLabel;
        var div=document.createElement("div");div.className="country-divider";
        if(groupLabel==="__other__")div.innerHTML='<span class="country-divider-label">Other Leagues</span><span class="country-divider-line"></span>';
        else{var fe=flagKey&&FLAGS[flagKey]?FLAGS[flagKey]:"\uD83C\uDFC6";div.innerHTML='<span class="country-divider-flag">'+fe+'</span><span class="country-divider-label">'+groupLabel+'</span><span class="country-divider-line"></span>';}
        container.appendChild(div);
      }
    }

    var block=document.createElement("div");block.className="league-block";
    var dot=isPriority?'<span class="priority-dot"></span>':'';
    var lhHtml='<div class="league-header" onclick="toggleStandings('+meta.id+',this)">'
      +'<span class="league-flag">'+(FLAGS[meta.country]||"\uD83C\uDFC6")+'</span>'
      +'<span class="league-name">'+meta.name+'</span>'+dot
      +'<span class="league-country">'+meta.country+'</span>'
      +'<span class="league-match-count">'+visible.length+'m</span>'
      +'<span class="standings-toggle">&#9776;</span></div>';
    var spHtml='<div class="standings-panel" id="standings-'+meta.id+'"></div>';
    var rowsHtml="";

    visible.forEach(function(f){
      var s=f.fixture.status,home=f.teams.home,away=f.teams.away,g=f.goals;
      var isLive=LIVE.indexOf(s.short)!==-1,isFT=["FT","AET","PEN"].indexOf(s.short)!==-1;
      var isHT=s.short==="HT",isNS=s.short==="NS";
      var hWin=isFT&&g.home>g.away,aWin=isFT&&g.away>g.home;
      var homeHit=searchActive&&home.name.toLowerCase().indexOf(searchQuery)!==-1;
      var awayHit=searchActive&&away.name.toLowerCase().indexOf(searchQuery)!==-1;
      var pill=makePill(s,isLive,isFT,isHT,isNS,f.fixture.date);
      var logoH=home.logo?'<img class="team-logo" src="'+home.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
      var logoA=away.logo?'<img class="team-logo" src="'+away.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
      var hNCls="team-name home"+(hWin?" winner":"")+(homeHit?" hit":"");
      var aNCls="team-name away"+(aWin?" winner":"")+(awayHit?" hit":"");
      var rowCls="match-row"+(searchActive?" search-match":"");
      var canExpand=isLive||isFT||isHT;
      var score=makeScore(isNS,g,isLive,hWin,aWin);
      rowsHtml+='<div class="'+rowCls+'" '+(canExpand?'onclick="toggleMatch('+f.fixture.id+','+home.id+',this)"':'style="cursor:default"')+'>'
        +'<div class="status-cell">'+pill+'</div>'
        +'<div class="team-home"><span class="'+hNCls+'">'+home.name+'</span>'+logoH+'</div>'
        +score
        +'<div class="team-away">'+logoA+'<span class="'+aNCls+'">'+away.name+'</span></div>'
        +'</div>'
        +(canExpand?'<div class="match-detail" id="detail-'+f.fixture.id+'" data-league-id="'+f.league.id+'" data-home-id="'+home.id+'" data-away-id="'+away.id+'"></div>':'');
    });

    block.innerHTML=lhHtml+spHtml+rowsHtml;
    container.appendChild(block);
  });

  if(searchActive){document.getElementById("searchCount").textContent=totalHits?totalHits+" found":"";if(totalHits===0)container.innerHTML='<div class="state-box"><div class="state-title">No Results</div><div class="state-sub">No matches for &ldquo;'+searchQuery+'&rdquo;</div></div>';}
  else document.getElementById("searchCount").textContent="";
  document.getElementById("liveBadge").style.display=hasLive?"flex":"none";
}

// ═══════════════════════════════════════════════════════════
// MATCH DETAIL
// ═══════════════════════════════════════════════════════════
async function toggleMatch(fixtureId,homeTeamId,el){
  var detailEl=document.getElementById("detail-"+fixtureId);
  if(!detailEl)return;
  var isOpen=detailEl.classList.contains("open");
  document.querySelectorAll(".match-detail.open").forEach(function(d){d.classList.remove("open");});
  document.querySelectorAll(".match-row.open").forEach(function(r){r.classList.remove("open");});
  if(isOpen)return;
  detailEl.classList.add("open");el.classList.add("open");
  if(detailEl.dataset.loaded==="1")return;
  detailEl.dataset.loaded="1";

  var leagueId=parseInt(detailEl.dataset.leagueId);
  var homeId=parseInt(detailEl.dataset.homeId);
  var awayId=parseInt(detailEl.dataset.awayId);
  var isWC=(leagueId===1);

  detailEl.innerHTML='<div class="detail-loading"><span class="mini-spinner"></span>Loading...</div>';
  try{
    var [evRes,stRes,luRes]=await Promise.all([
      apiFetch('/fixtures/events?fixture='+fixtureId),
      apiFetch('/fixtures/statistics?fixture='+fixtureId),
      apiFetch('/fixtures/lineups?fixture='+fixtureId)
    ]);
    var evHtml=renderEvents(evRes.response||[],homeTeamId);
    var stHtml=renderStats(stRes.response||[]);
    var luHtml=renderLineup(luRes.response||[]);
    detailEl.innerHTML=
      '<div class="detail-tabs">'
      +'<button class="detail-tab active" onclick="switchTab(this,\'ev-'+fixtureId+'\')">Events</button>'
      +'<button class="detail-tab" onclick="switchTab(this,\'st-'+fixtureId+'\')">Stats</button>'
      +'<button class="detail-tab" onclick="switchTab(this,\'lu-'+fixtureId+'\')">Lineup</button>'
      +'</div>'

      +'<div class="detail-pane" id="st-'+fixtureId+'">'+stHtml+'</div>'
      +'<div class="detail-pane" id="lu-'+fixtureId+'">'+luHtml+'</div>';

    if(isWC){

          return g.some(function(t){return t.team.id===homeId||t.team.id===awayId;});
        });

}

function switchTab(btn,paneId){
  var parent=btn.closest(".match-detail");
  parent.querySelectorAll(".detail-tab").forEach(function(t){t.classList.remove("active");});
  parent.querySelectorAll(".detail-pane").forEach(function(p){p.classList.remove("active");});
  btn.classList.add("active");

}

// ═══════════════════════════════════════════════════════════
// EVENTS RENDER
// ═══════════════════════════════════════════════════════════
function eventIcon(type,detail){
  var t=(type||"").toLowerCase(),d=(detail||"").toLowerCase();
  if(t==="goal"){if(d.indexOf("missed")!==-1)return"\u274C (P)";if(d.indexOf("own")!==-1)return"\u26BD OG";if(d.indexOf("penalty")!==-1)return"\u26BD (P)";return"\u26BD";}
  if(t==="card"){if(d.indexOf("red")!==-1)return"\uD83D\uDFE5";if(d.indexOf("yellow-red")!==-1)return"\uD83D\uDFE7";return"\uD83D\uDFE8";}
  if(t==="subst")return"\uD83D\uDD04";
  if(t==="var")return"\uD83D\uDCFA";
  return"\u2022";
}
function renderEvents(events,homeTeamId){
  if(!events||events.length===0)return'<div class="no-data">No events available</div>';
  var html='<div class="events-list">';
  events.forEach(function(ev){
    var isHome=ev.team&&ev.team.id===homeTeamId;
    var icon=eventIcon(ev.type,ev.detail);
    var isSub=(ev.type||"").toLowerCase()==="subst";
    var player=ev.player&&ev.player.name?ev.player.name:"";
    var assist;
    if(isSub){
      player='<span class="sub-on">\u2191 '+player+'</span>';
      assist=ev.assist&&ev.assist.name?'<span class="event-sub sub-off">\u2193 '+ev.assist.name+'</span>':'';
    }else{
      assist=ev.assist&&ev.assist.name?'<span class="event-sub">\u2191 '+ev.assist.name+'</span>':'';
    }
    var min=(ev.time&&ev.time.elapsed?ev.time.elapsed:"?")+(ev.time&&ev.time.extra?"+"+ev.time.extra:"")+"'";
    var homeContent=isHome?'<span>'+icon+'</span> '+player+assist:'';
    var awayContent=!isHome?player+assist+' <span>'+icon+'</span>':'';
    html+='<div class="event-row"><div class="event-home">'+homeContent+'</div><div class="event-min">'+min+'</div><div class="event-away">'+awayContent+'</div></div>';
  });
  return html+'</div>';
}

// ═══════════════════════════════════════════════════════════
// STATS RENDER
// ═══════════════════════════════════════════════════════════
function renderStats(stats){
  if(!stats||stats.length<2)return'<div class="no-data">No stats available</div>';
  var hS={},aS={};
  (stats[0].statistics||[]).forEach(function(s){hS[s.type]=s.value;});
  (stats[1].statistics||[]).forEach(function(s){aS[s.type]=s.value;});
  var keys=["Ball Possession","Shots on Goal","Shots off Goal","Total Shots","Blocked Shots","Corner Kicks","Fouls","Yellow Cards","Red Cards","Goalkeeper Saves","Total passes","Passes accurate","Passes %","Offsides"];
  var html='<div class="stats-list">';
  keys.forEach(function(key){
    var hv=hS[key],av=aS[key];
    if(hv===null&&av===null)return;
    if(hv===undefined&&av===undefined)return;
    var hNum=parseFloat(String(hv||0).replace("%",""))||0;
    var aNum=parseFloat(String(av||0).replace("%",""))||0;
    var total=hNum+aNum;
    var hPct=total>0?Math.round(hNum/total*100):50;
    html+='<div class="stat-row"><div class="stat-labels"><span class="stat-val">'+(hv!==null&&hv!==undefined?hv:0)+'</span><span class="stat-name">'+key+'</span><span class="stat-val">'+(av!==null&&av!==undefined?av:0)+'</span></div>'
      +'<div class="stat-bar-wrap"><div class="stat-bar-home" style="width:'+hPct+'%"></div><div class="stat-bar-away" style="width:'+(100-hPct)+'%"></div></div></div>';
  });
  return html+'</div>';
}

// ═══════════════════════════════════════════════════════════
// LINEUP RENDER
// ═══════════════════════════════════════════════════════════
function renderLineup(lineups){
  if(!lineups||lineups.length===0)return'<div class="no-data">Lineup not available</div>';
  var home=lineups[0],away=lineups[1]||{};
  var homeFormation=home.formation||"";
  var awayFormation=away.formation||"";
  var homePlayers=home.startXI||[];
  var awayPlayers=away.startXI||[];
  var homeSubs=home.substitutes||[];
  var awaySubs=away.substitutes||[];
  var homeTeamName=home.team?home.team.name:"Home";
  var awayTeamName=away.team?away.team.name:"Away";

  var W=300,H=440;
  var svg='<svg class="pitch-svg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  svg+='<rect width="'+W+'" height="'+H+'" fill="#1a3a1a"/>';
  for(var i=0;i<9;i++){var sy=i*50;svg+='<rect x="0" y="'+sy+'" width="'+W+'" height="25" fill="rgba(0,0,0,0.08)"/>';}
  svg+='<rect x="10" y="10" width="'+(W-20)+'" height="'+(H-20)+'" class="pitch-line-bold"/>';
  svg+='<line x1="10" y1="'+H/2+'" x2="'+(W-10)+'" y2="'+H/2+'" class="pitch-line"/>';
  svg+='<circle cx="'+W/2+'" cy="'+H/2+'" r="40" class="pitch-line"/>';
  svg+='<circle cx="'+W/2+'" cy="'+H/2+'" r="2" fill="rgba(255,255,255,0.4)"/>';
  var paW=160,paH=50;
  svg+='<rect x="'+((W-paW)/2)+'" y="10" width="'+paW+'" height="'+paH+'" class="pitch-line"/>';
  svg+='<rect x="'+((W-paW)/2)+'" y="'+(H-10-paH)+'" width="'+paW+'" height="'+paH+'" class="pitch-line"/>';
  var gaW=80,gaH=20;
  svg+='<rect x="'+((W-gaW)/2)+'" y="10" width="'+gaW+'" height="'+gaH+'" class="pitch-line"/>';
  svg+='<rect x="'+((W-gaW)/2)+'" y="'+(H-10-gaH)+'" width="'+gaW+'" height="'+gaH+'" class="pitch-line"/>';

  function positionPlayers(players,formation,isHome){
    if(!players||players.length===0)return'';
    var result='';
    var rows=formation?formation.split('-').map(Number):[];
    var allRows=[1].concat(rows);
    var totalRows=allRows.length;
    var playerIdx=0;
    allRows.forEach(function(count,rowIdx){
      var playersInRow=[];
      for(var p=0;p<count;p++){if(playerIdx<players.length){playersInRow.push(players[playerIdx]);playerIdx++;}}
      var rowFraction=(rowIdx+0.5)/totalRows;
      var y;
      if(isHome)y=H*0.97-rowFraction*(H*0.45);
      else y=H*0.03+rowFraction*(H*0.45);
      playersInRow.forEach(function(p,pIdx){
        var x=W*(pIdx+1)/(playersInRow.length+1);
        var num=p.player&&p.player.number?p.player.number:'';
        var name=p.player&&p.player.name?p.player.name.split(' ').pop():'';
        var color=isHome?'#b5ff2d':'#2d8fff';
        result+='<g class="player-dot">'
          +'<circle cx="'+x+'" cy="'+y+'" r="12" fill="'+color+'" fill-opacity="0.85" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>'
          +'<text class="player-num-text" x="'+x+'" y="'+(y-3)+'" fill="#000">'+num+'</text>'
          +'<text class="player-name-text" x="'+x+'" y="'+(y+18)+'" fill="rgba(255,255,255,0.9)" font-size="8">'+name+'</text>'
          +'</g>';
      });
    });
    return result;
  }

  svg+=positionPlayers(homePlayers,homeFormation,true);
  svg+=positionPlayers(awayPlayers,awayFormation,false);
  svg+='<text x="'+W/2+'" y="7" text-anchor="middle" font-family="Oswald,sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">'+awayTeamName+'</text>';
  svg+='<text x="'+W/2+'" y="'+(H-2)+'" text-anchor="middle" font-family="Oswald,sans-serif" font-size="9" fill="rgba(255,255,255,0.5)">'+homeTeamName+'</text>';
  svg+='</svg>';

  function subsList(subs,label){
    if(!subs||subs.length===0)return'';
    var h='<div style="margin-bottom:12px"><div class="subs-label">'+label+' Subs</div><div class="subs-grid">';
    subs.forEach(function(s){
      var num=s.player&&s.player.number?s.player.number:'';
      var name=s.player&&s.player.name?s.player.name:'';
      h+='<div class="sub-player"><span class="sub-num">'+num+'</span>'+name+'</div>';
    });
    return h+'</div></div>';
  }

  return '<div class="lineup-wrap">'
    +'<div class="lineup-header">'
    +'<div class="lineup-team"><div class="lineup-team-name">'+homeTeamName+'</div><div class="lineup-formation">'+homeFormation+'</div></div>'
    +'<div class="lineup-team"><div class="lineup-team-name">'+awayTeamName+'</div><div class="lineup-formation">'+awayFormation+'</div></div>'
    +'</div>'
    +'<div class="pitch-container">'+svg+'</div>'
    +'<div class="lineup-subs">'+subsList(homeSubs,homeTeamName)+subsList(awaySubs,awayTeamName)+'</div>'
    +'</div>';
}

// ═══════════════════════════════════════════════════════════
// STANDINGS (league header click)
// ═══════════════════════════════════════════════════════════
async function toggleStandings(leagueId,headerEl){
  var panelEl=document.getElementById("standings-"+leagueId);
  if(!panelEl)return;
  var isOpen=panelEl.classList.contains("open");
  panelEl.classList.toggle("open");
  headerEl.classList.toggle("standings-open");
  if(isOpen||panelEl.dataset.loaded==="1")return;
  panelEl.dataset.loaded="1";
  panelEl.innerHTML='<div class="standings-loading"><span class="mini-spinner"></span>Loading standings...</div>';
  try{
    var data=await apiFetch('/standings?league='+leagueId+'&season='+currentSeason());
    panelEl.innerHTML=renderStandingsTable(data.response||[]);
  }catch(e){panelEl.innerHTML='<div class="no-data">Could not load standings</div>';}
}

function currentSeason(){
  var now=new Date(),year=now.getFullYear(),month=now.getMonth()+1;
  return month>=8?year:year-1;
}

function renderStandingsTable(data){
  if(!data||data.length===0)return'<div class="no-data">No standings available</div>';
  var league=data[0];
  if(!league.league||!league.league.standings)return'<div class="no-data">No standings available</div>';
  var html='';
  league.league.standings.forEach(function(group){
    html+='<table class="standings-table"><thead><tr>'
      +'<th class="left" style="width:24px">#</th><th class="left">Team</th>'
      +'<th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Form</th>'
      +'</tr></thead><tbody>';
    group.forEach(function(row){
      var desc=(row.description||"").toLowerCase();
      var zc=desc.indexOf("champions")!==-1||desc.indexOf("promotion")!==-1?"zone-promo":desc.indexOf("europa")!==-1||desc.indexOf("conference")!==-1?"zone-euro":desc.indexOf("relegation")!==-1?"zone-relegation":"";
      var formPips="";
      if(row.form)row.form.split("").slice(-5).forEach(function(c){formPips+='<span class="form-pip '+(c==="W"?"form-w":c==="D"?"form-d":"form-l")+'"></span>';});
      var logo=row.team&&row.team.logo?'<img src="'+row.team.logo+'" onerror="this.style.display=\'none\'" style="width:16px;height:16px;object-fit:contain" alt="">':'';
      var gd=(row.goalsDiff>0?"+":"")+row.goalsDiff;
      html+='<tr class="'+zc+'">'
        +'<td class="pos-num left">'+row.rank+'</td>'
        +'<td class="left"><div class="team-cell">'+logo+'<span>'+row.team.name+'</span></div></td>'
        +'<td>'+row.all.played+'</td><td>'+row.all.win+'</td><td>'+row.all.draw+'</td><td>'+row.all.lose+'</td>'
        +'<td>'+gd+'</td><td class="pts">'+row.points+'</td><td>'+formPips+'</td></tr>';
    });
    html+='</tbody></table>';
  });
  return html;
}

      assists.slice(0,20).forEach(function(p,i){
        var photo=p.player&&p.player.photo?'<img class="player-photo" src="'+p.player.photo+'" alt="" onerror="this.style.display=\'none\'">':'';
        var name=p.player?p.player.name:'';
        var team=p.statistics&&p.statistics[0]&&p.statistics[0].team?p.statistics[0].team.name:'';
        var goals=p.statistics&&p.statistics[0]?p.statistics[0].goals.total||0:0;
        var assistCount=p.statistics&&p.statistics[0]?p.statistics[0].goals.assists||0:0;
        var apps=p.statistics&&p.statistics[0]?p.statistics[0].games.appearences||0:0;
        assistsHtml+='<tr><td class="player-rank left">'+(i+1)+'</td><td class="left">'+photo+name+'</td><td class="left">'+team+'</td><td class="highlight">'+assistCount+'</td><td>'+goals+'</td><td>'+apps+'</td></tr>';
      });
      assistsHtml+='</tbody></table>';
    }
    assistsHtml+='</div>';

    html+=fixHtml+standHtml+scorersHtml+assistsHtml;
    content.innerHTML=html;
  }catch(e){content.innerHTML='<div class="error-box">'+e.message+'</div>';}
}

function switchPageTab(btn,paneId){
  var parent=btn.closest('.main-area');
  parent.querySelectorAll('.page-tab').forEach(function(t){t.classList.remove('active');});
  parent.querySelectorAll('.page-pane').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(paneId).classList.add('active');
}

// ═══════════════════════════════════════════════════════════
// SIMPLE MATCH ROW
// ═══════════════════════════════════════════════════════════
function makeSimpleMatchRow(f){
  var s=f.fixture.status,home=f.teams.home,away=f.teams.away,g=f.goals;
  var isLive=LIVE.indexOf(s.short)!==-1,isFT=["FT","AET","PEN"].indexOf(s.short)!==-1;
  var isHT=s.short==="HT",isNS=s.short==="NS";
  var hWin=isFT&&g.home>g.away,aWin=isFT&&g.away>g.home;
  var pill=makePill(s,isLive,isFT,isHT,isNS,f.fixture.date);
  var logoH=home.logo?'<img class="team-logo" src="'+home.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
  var logoA=away.logo?'<img class="team-logo" src="'+away.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
  var score=makeScore(isNS,g,isLive,hWin,aWin);
  return '<div class="match-row" style="cursor:default">'
    +'<div class="status-cell">'+pill+'</div>'
    +'<div class="team-home"><span class="team-name home'+(hWin?' winner':'')+'">'+home.name+'</span>'+logoH+'</div>'
    +score
    +'<div class="team-away">'+logoA+'<span class="team-name away'+(aWin?' winner':'')+'">'+away.name+'</span></div>'
    +'</div>';
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function makePill(s,isLive,isFT,isHT,isNS,date){
  if(isHT)return'<span class="status-pill s-ht">HT</span>';
  if(isLive)return'<span class="status-pill s-live">'+(s.elapsed?s.elapsed+"'":"•")+'</span>';
  if(isFT)return'<span class="status-pill s-ft">FT</span>';
  if(isNS){var t=new Date(date).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});return'<span class="status-pill s-ns">'+t+'</span>';}
  return'<span class="status-pill s-other">'+(s.short||"?")+'</span>';
}
function makeScore(isNS,g,isLive,hWin,aWin){
  if(isNS)return'<div class="score-block"><span class="score-vs">VS</span></div>';
  var hSCls="score-num"+(isLive?" live":hWin?" winner":"");
  var aSCls="score-num"+(isLive?" live":aWin?" winner":"");
  return'<div class="score-block"><span class="'+hSCls+'">'+(g.home!==null?g.home:"-")+'</span><span class="score-dash">:</span><span class="'+aSCls+'">'+(g.away!==null?g.away:"-")+'</span></div>';
}
function showState(on){document.getElementById("stateBox").style.display=on?"block":"none";}
function showError(msg){var e=document.getElementById("errorBox");e.textContent="\u26A0 "+msg;e.style.display="block";}
function hideError(){document.getElementById("errorBox").style.display="none";}
function scheduleRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  if(fmtParam(currentDate)===fmtParam(new Date()))refreshTimer=setInterval(loadFixtures,60000);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
document.getElementById("dateLabel").textContent=fmtLabel(currentDate);
fetchWCStandings();
loadFixtures();
</script>
