<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHITHOUSE FOOTBALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #080808;
    --pitch: #0f1a0f;
    --lime: #b5ff2d;
    --lime-dim: #b5ff2d22;
    --white: #f0f0f0;
    --grey: #888;
    --dimgrey: #333;
    --red: #ff2d2d;
    --red-dim: #ff2d2d20;
    --yellow: #ffd600;
    --blue: #2d8fff;
    --border: #1e1e1e;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Oswald', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
 
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }
 
  header {
    background: var(--lime);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 4px solid var(--black);
  }
 
  .header-inner { display: flex; align-items: stretch; justify-content: space-between; }
 
  .site-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 6vw, 52px);
    color: var(--black);
    letter-spacing: 0.02em;
    padding: 10px 20px;
    line-height: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
 
  .site-title span {
    display: block;
    font-size: 0.38em;
    letter-spacing: 0.18em;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    color: #1a1a1a;
    margin-top: 2px;
  }
 
  .header-meta {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    padding: 10px 16px;
    gap: 4px;
  }
 
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--red);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border-radius: 2px;
  }
 
  .live-dot {
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    animation: blink 1.2s ease-in-out infinite;
  }
 
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
 
  .last-updated {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #2a2a2a;
    letter-spacing: 0.04em;
  }
 
  .controls {
    background: var(--pitch);
    border-bottom: 2px solid var(--lime);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    flex-wrap: wrap;
    min-height: 46px;
  }
 
  .date-nav { display: flex; align-items: center; height: 46px; }
 
  .date-arrow {
    background: transparent;
    border: none;
    color: var(--lime);
    font-size: 22px;
    width: 36px;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
  }
 
  .date-arrow:hover { background: var(--lime-dim); }
 
  .date-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: var(--white);
    min-width: 120px;
    text-align: center;
  }
 
  .filter-tabs { display: flex; height: 46px; align-items: center; }
 
  .filter-tab {
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--grey);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0 14px;
    height: 46px;
    cursor: pointer;
    transition: all 0.15s;
  }
 
  .filter-tab:hover { color: var(--white); }
  .filter-tab.active { color: var(--lime); border-bottom-color: var(--lime); }
 
  .refresh-btn {
    background: transparent;
    border: 1px solid var(--dimgrey);
    color: var(--grey);
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-transform: uppercase;
  }
 
  .refresh-btn:hover { border-color: var(--lime); color: var(--lime); }
 
  /* ── SEARCH ── */
  .search-bar {
    background: #0c0c0c;
    border-bottom: 1px solid var(--border);
    padding: 9px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .search-wrap { position: relative; flex: 1; }
 
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--grey);
    font-size: 13px;
    pointer-events: none;
    font-family: monospace;
  }
 
  .search-input {
    width: 100%;
    background: #161616;
    border: 1px solid var(--dimgrey);
    border-radius: 3px;
    padding: 8px 12px 8px 30px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--white);
    outline: none;
    transition: border-color 0.15s;
  }
 
  .search-input:focus { border-color: var(--lime); }
  .search-input::placeholder { color: var(--dimgrey); }
 
  .search-clear {
    background: transparent;
    border: none;
    color: var(--grey);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 6px;
    display: none;
    line-height: 1;
  }
 
  .search-clear.show { display: block; }
  .search-clear:hover { color: var(--lime); }
 
  .search-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--grey);
    min-width: 56px;
    text-align: right;
    white-space: nowrap;
  }
 
  /* ── MAIN ── */
  main { max-width: 860px; margin: 0 auto; padding: 16px 12px 60px; }
 
  .league-block {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    animation: slideUp 0.25s ease forwards;
    opacity: 0;
  }
 
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  .league-block:nth-child(1)  { animation-delay: 0.03s; }
  .league-block:nth-child(2)  { animation-delay: 0.06s; }
  .league-block:nth-child(3)  { animation-delay: 0.09s; }
  .league-block:nth-child(4)  { animation-delay: 0.12s; }
  .league-block:nth-child(5)  { animation-delay: 0.15s; }
  .league-block:nth-child(6)  { animation-delay: 0.18s; }
  .league-block:nth-child(7)  { animation-delay: 0.21s; }
  .league-block:nth-child(8)  { animation-delay: 0.24s; }
  .league-block:nth-child(9)  { animation-delay: 0.27s; }
  .league-block:nth-child(10) { animation-delay: 0.30s; }
 
  .league-header {
    background: #111;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
  }
 
  .league-flag { font-size: 15px; flex-shrink: 0; }
 
  .league-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);
  }
 
  .priority-dot {
    width: 5px; height: 5px;
    background: var(--lime);
    border-radius: 50%;
    flex-shrink: 0;
  }
 
  .league-country {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--dimgrey);
  }
 
  .league-match-count {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--dimgrey);
  }
 
  .match-row {
    display: grid;
    grid-template-columns: 64px 1fr auto 1fr;
    align-items: center;
    padding: 11px 12px;
    border-bottom: 1px solid #111;
    gap: 10px;
    transition: background 0.12s;
  }
 
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: #0e0e0e; }
  .match-row.search-match { background: #0b160b; }
  .match-row.search-match:hover { background: #0f1e0f; }
 
  .status-cell { text-align: center; }
 
  .status-pill {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 0.04em;
  }
 
  .s-live { background: var(--red-dim); color: var(--red); animation: livePulse 2s ease-in-out infinite; }
 
  @keyframes livePulse {
    0%, 100% { background: var(--red-dim); }
    50% { background: #ff2d2d30; }
  }
 
  .s-ht    { background: #ffd60020; color: var(--yellow); }
  .s-ft    { background: #2d8fff18; color: var(--blue); }
  .s-ns    { background: transparent; color: var(--dimgrey); font-size: 12px; }
  .s-other { background: transparent; color: var(--dimgrey); }
 
  .team-home { display: flex; align-items: center; justify-content: flex-end; gap: 9px; }
  .team-away { display: flex; align-items: center; justify-content: flex-start; gap: 9px; }
 
  .team-logo { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }
 
  .team-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--white);
    line-height: 1.2;
  }
 
  .team-name.home { text-align: right; }
  .team-name.away { text-align: left; }
  .team-name.winner { color: var(--lime); font-weight: 700; }
  .team-name.hit { color: var(--lime); font-weight: 700; }
 
  .score-block { display: flex; align-items: center; justify-content: center; min-width: 56px; }
 
  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--white);
    width: 26px;
    text-align: center;
    line-height: 1;
  }
 
  .score-num.live   { color: var(--lime); }
  .score-num.winner { color: var(--lime); }
 
  .score-dash { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--dimgrey); width: 12px; text-align: center; }
  .score-vs   { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; color: var(--dimgrey); letter-spacing: 0.08em; }
 
  .state-box { text-align: center; padding: 70px 20px; color: var(--grey); }
 
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid #1e1e1e;
    border-top-color: var(--lime);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    margin: 0 auto 18px;
  }
 
  @keyframes spin { to { transform: rotate(360deg); } }
 
  .state-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.1em; color: var(--grey); margin-bottom: 6px; }
  .state-sub   { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dimgrey); letter-spacing: 0.06em; }
 
  .error-box {
    background: #120808;
    border: 1px solid #ff2d2d40;
    border-left: 3px solid var(--red);
    border-radius: 3px;
    padding: 16px 18px;
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #ff8888;
    line-height: 1.7;
  }
 
  footer {
    text-align: center;
    padding: 24px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #222;
    border-top: 1px solid #111;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
 
  @media (max-width: 500px) {
    .team-name  { font-size: 13px; }
    .score-num  { font-size: 20px; }
    .match-row  { grid-template-columns: 56px 1fr auto 1fr; gap: 6px; padding: 10px 8px; }
    .filter-tab { padding: 0 10px; font-size: 12px; }
  }
</style>
</head>
<body>
 
<header>
  <div class="header-inner">
    <div class="site-title">
      SHITHOUSE<br>FOOTBALL
      <span>Live Scores · All Leagues</span>
    </div>
    <div class="header-meta">
      <div class="live-badge" id="liveBadge" style="display:none">
        <div class="live-dot"></div>
        LIVE
      </div>
      <div class="last-updated" id="lastUpdated"></div>
    </div>
  </div>
</header>
 
<div class="controls">
  <div class="date-nav">
    <button class="date-arrow" onclick="changeDate(-1)">&#8249;</button>
    <div class="date-label" id="dateLabel">TODAY</div>
    <button class="date-arrow" onclick="changeDate(1)">&#8250;</button>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
    <button class="filter-tab" onclick="setFilter('live',this)">Live</button>
    <button class="filter-tab" onclick="setFilter('ft',this)">FT</button>
    <button class="filter-tab" onclick="setFilter('ns',this)">Soon</button>
  </div>
  <button class="refresh-btn" onclick="loadFixtures()">&#8635; Refresh</button>
</div>
 
<div class="search-bar">
  <div class="search-wrap">
    <span class="search-icon">&#9906;</span>
    <input class="search-input" id="searchInput" type="text"
      placeholder="Search team..." oninput="onSearch()"
      autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
  <button class="search-clear" id="searchClear" onclick="clearSearch()">&#x2715;</button>
  <div class="search-count" id="searchCount"></div>
</div>
 
<main>
  <div class="state-box" id="stateBox">
    <div class="spinner"></div>
    <div class="state-title">Loading Fixtures</div>
    <div class="state-sub">Fetching from all leagues...</div>
  </div>
  <div id="errorBox" class="error-box" style="display:none"></div>
  <div id="container"></div>
</main>
 
<footer>
  Shithousefootball.com &middot; Data by API-Football &middot; Refreshes every 60s
</footer>
 
<script>
var LIVE = ["1H","2H","ET","BT","P","INT","LIVE"];
 
var FLAGS = {
  England:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC65\uDB40\uDC6E\uDB40\uDC67\uDB40\uDC7F",
  Spain:"\uD83C\uDDEA\uD83C\uDDF8",Germany:"\uD83C\uDDE9\uD83C\uDDEA",Italy:"\uD83C\uDDEE\uD83C\uDDF9",
  France:"\uD83C\uDDEB\uD83C\uDDF7",Netherlands:"\uD83C\uDDF3\uD83C\uDDF1",Portugal:"\uD83C\uDDF5\uD83C\uDDF9",
  Brazil:"\uD83C\uDDE7\uD83C\uDDF7",Argentina:"\uD83C\uDDE6\uD83C\uDDF7",USA:"\uD83C\uDDFA\uD83C\uDDF8",
  Mexico:"\uD83C\uDDF2\uD83C\uDDFD",Belgium:"\uD83C\uDDE7\uD83C\uDDEA",Turkey:"\uD83C\uDDF9\uD83C\uDDF7",
  Scotland:"\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F",
  World:"\uD83C\uDF0D",Europe:"\uD83C\uDDEA\uD83C\uDDFA",
  "Saudi-Arabia":"\uD83C\uDDF8\uD83C\uDDE6",Japan:"\uD83C\uDDEF\uD83C\uDDF5",
  "South Korea":"\uD83C\uDDF0\uD83C\uDDF7",Australia:"\uD83C\uDDE6\uD83C\uDDFA",
  Colombia:"\uD83C\uDDE8\uD83C\uDDF4",Chile:"\uD83C\uDDE8\uD83C\uDDF1",
  Uruguay:"\uD83C\uDDFA\uD83C\uDDFE",Greece:"\uD83C\uDDEC\uD83C\uDDF7",
  China:"\uD83C\uDDE8\uD83C\uDDF3",Nigeria:"\uD83C\uDDF3\uD83C\uDDEC",Morocco:"\uD83C\uDDF2\uD83C\uDDE6"
};
 
// Priority order — leagues are shown in this order, then everything else alphabetically
var PRIORITY = [
  "Premier League",
  "Championship",
  "League One",
  "League Two",
  "Scottish Premiership",
  "La Liga",
  "La Liga2",
  "Serie A",
  "Serie B",
  "Bundesliga 1",
  "Bundesliga 2",
  "Ligue 1",
  "UEFA Champions League",
  "UEFA Europa League",
  "UEFA Europa Conference League",
  "Eredivisie",
  "Super Lig",
  "Primeira Liga",
  "Major League Soccer",
  "Pro League",
  "Friendlies",
  "World Cup"
];
 
function getPriority(name) {
  var n = name.toLowerCase();
  for (var i = 0; i < PRIORITY.length; i++) {
    var p = PRIORITY[i].toLowerCase();
    if (n.indexOf(p) !== -1 || p.indexOf(n) !== -1) return i;
  }
  return PRIORITY.length;
}
 
var currentDate = new Date();
var currentFilter = 'all';
var refreshTimer = null;
var allFixtures = [];
var searchQuery = '';
 
function fmtParam(d) { return d.toISOString().split("T")[0]; }
function fmtLabel(d) {
  var t = new Date(); t.setHours(0,0,0,0);
  var x = new Date(d); x.setHours(0,0,0,0);
  var diff = Math.round((x-t)/86400000);
  if (diff===0) return "TODAY";
  if (diff===-1) return "YESTERDAY";
  if (diff===1) return "TOMORROW";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase();
}
 
function changeDate(delta) {
  currentDate.setDate(currentDate.getDate()+delta);
  document.getElementById("dateLabel").textContent = fmtLabel(currentDate);
  loadFixtures();
}
 
function setFilter(f,el) {
  currentFilter = f;
  document.querySelectorAll(".filter-tab").forEach(function(t){t.classList.remove("active");});
  el.classList.add("active");
  render();
}
 
function onSearch() {
  searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
  var btn = document.getElementById("searchClear");
  if (searchQuery) btn.classList.add("show"); else btn.classList.remove("show");
  render();
}
 
function clearSearch() {
  document.getElementById("searchInput").value = "";
  searchQuery = "";
  document.getElementById("searchClear").classList.remove("show");
  document.getElementById("searchCount").textContent = "";
  render();
}
 
async function loadFixtures() {
  showState(true); hideError();
  try {
    var res = await fetch("/api/fixtures?date="+fmtParam(currentDate));
    if (!res.ok) throw new Error("Server error "+res.status);
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    allFixtures = data.fixtures || [];
    render();
    document.getElementById("lastUpdated").textContent =
      "Updated "+new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
    scheduleRefresh();
  } catch(e) {
    showError(e.message);
  } finally {
    showState(false);
  }
}
 
function render() {
  var container = document.getElementById("container");
  container.innerHTML = "";
 
  // Status filter
  var filtered = allFixtures;
  if (currentFilter==="live")
    filtered = allFixtures.filter(function(f){return LIVE.indexOf(f.fixture.status.short)!==-1;});
  else if (currentFilter==="ft")
    filtered = allFixtures.filter(function(f){return ["FT","AET","PEN"].indexOf(f.fixture.status.short)!==-1;});
  else if (currentFilter==="ns")
    filtered = allFixtures.filter(function(f){return f.fixture.status.short==="NS";});
 
  // Group by league
  var leagueMap = {};
  filtered.forEach(function(f){
    var id = f.league.id;
    if (!leagueMap[id]) leagueMap[id]={meta:f.league,matches:[]};
    leagueMap[id].matches.push(f);
  });
 
  // Sort by priority then alphabetically
  var groups = Object.values(leagueMap).sort(function(a,b){
    var ap = getPriority(a.meta.name);
    var bp = getPriority(b.meta.name);
    if (ap!==bp) return ap-bp;
    return a.meta.name.localeCompare(b.meta.name);
  });
 
  if (groups.length===0) {
    container.innerHTML='<div class="state-box"><div class="state-title">No Matches</div><div class="state-sub">Nothing to show for this filter</div></div>';
    document.getElementById("liveBadge").style.display="none";
    document.getElementById("searchCount").textContent="";
    return;
  }
 
  var searchActive = searchQuery.length >= 2;
  var totalHits = 0;
  var hasLive = false;
 
  groups.forEach(function(group){
    var meta = group.meta;
    var matches = group.matches;
    var isPriority = getPriority(meta.name) < PRIORITY.length;
 
    // Search filter within league
    var visible = matches;
    if (searchActive) {
      visible = matches.filter(function(f){
        return f.teams.home.name.toLowerCase().indexOf(searchQuery)!==-1 ||
               f.teams.away.name.toLowerCase().indexOf(searchQuery)!==-1;
      });
      if (visible.length===0) return;
      totalHits += visible.length;
    }
 
    if (visible.some(function(m){return LIVE.indexOf(m.fixture.status.short)!==-1;})) hasLive=true;
 
    var rows="";
    visible.forEach(function(f){
      var s=f.fixture.status, home=f.teams.home, away=f.teams.away, g=f.goals;
      var isLive=LIVE.indexOf(s.short)!==-1;
      var isFT=["FT","AET","PEN"].indexOf(s.short)!==-1;
      var isHT=s.short==="HT", isNS=s.short==="NS";
      var hWin=isFT&&g.home>g.away, aWin=isFT&&g.away>g.home;
      var homeHit=searchActive&&home.name.toLowerCase().indexOf(searchQuery)!==-1;
      var awayHit=searchActive&&away.name.toLowerCase().indexOf(searchQuery)!==-1;
 
      var pill;
      if (isHT) pill='<span class="status-pill s-ht">HT</span>';
      else if (isLive) pill='<span class="status-pill s-live">'+(s.elapsed?s.elapsed+"'":"•")+'</span>';
      else if (isFT) pill='<span class="status-pill s-ft">FT</span>';
      else if (isNS) {
        var t=new Date(f.fixture.date).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
        pill='<span class="status-pill s-ns">'+t+'</span>';
      } else pill='<span class="status-pill s-other">'+s.short+'</span>';
 
      var logoH=home.logo?'<img class="team-logo" src="'+home.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
      var logoA=away.logo?'<img class="team-logo" src="'+away.logo+'" alt="" onerror="this.style.display=\'none\'">':'';
 
      var hNCls="team-name home"+(hWin?" winner":"")+(homeHit?" hit":"");
      var aNCls="team-name away"+(aWin?" winner":"")+(awayHit?" hit":"");
      var rowCls="match-row"+(searchActive?" search-match":"");
 
      var score;
      if (isNS) {
        score='<div class="score-block"><span class="score-vs">VS</span></div>';
      } else {
        var hSCls="score-num"+(isLive?" live":hWin?" winner":"");
        var aSCls="score-num"+(isLive?" live":aWin?" winner":"");
        score='<div class="score-block"><span class="'+hSCls+'">'+(g.home!==null?g.home:"-")+'</span><span class="score-dash">:</span><span class="'+aSCls+'">'+(g.away!==null?g.away:"-")+'</span></div>';
      }
 
      rows+='<div class="'+rowCls+'"><div class="status-cell">'+pill+'</div><div class="team-home"><span class="'+hNCls+'">'+home.name+'</span>'+logoH+'</div>'+score+'<div class="team-away">'+logoA+'<span class="'+aNCls+'">'+away.name+'</span></div></div>';
    });
 
    var dot=isPriority?'<span class="priority-dot"></span>':'';
    var block=document.createElement("div");
    block.className="league-block";
    block.innerHTML='<div class="league-header"><span class="league-flag">'+(FLAGS[meta.country]||"\uD83C\uDFC6")+'</span><span class="league-name">'+meta.name+'</span>'+dot+'<span class="league-country">'+meta.country+'</span><span class="league-match-count">'+visible.length+'m</span></div>'+rows;
    container.appendChild(block);
  });
 
  // Search result count
  if (searchActive) {
    document.getElementById("searchCount").textContent = totalHits ? totalHits+" found" : "";
    if (totalHits===0) {
      container.innerHTML='<div class="state-box"><div class="state-title">No Results</div><div class="state-sub">No matches found for &ldquo;'+searchQuery+'&rdquo;</div></div>';
    }
  } else {
    document.getElementById("searchCount").textContent="";
  }
 
  document.getElementById("liveBadge").style.display=hasLive?"flex":"none";
}
 
function showState(on) { document.getElementById("stateBox").style.display=on?"block":"none"; }
function showError(msg) { var e=document.getElementById("errorBox"); e.textContent="⚠ "+msg; e.style.display="block"; }
function hideError() { document.getElementById("errorBox").style.display="none"; }
 
function scheduleRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (fmtParam(currentDate)===fmtParam(new Date()))
    refreshTimer=setInterval(loadFixtures,60000);
}
 
document.getElementById("dateLabel").textContent=fmtLabel(currentDate);
loadFixtures();
</script>
</body>
</html>
